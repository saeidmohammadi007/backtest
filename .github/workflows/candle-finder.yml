name: Backtest Top-20 Coins

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * *'

permissions:
  contents: write

concurrency:
  group: backtest-top20
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4" "pandas==2.2.2" "requests==2.32.3"

      - name: Run backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RANGE_DAYS: "700"
        run: python backtest.py

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_number }}
          path: results/
          retention-days: 30

      - name: Commit latest.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/latest.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update backtest $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
