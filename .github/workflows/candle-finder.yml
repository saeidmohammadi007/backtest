name: Backtest Top-20 Coins

on:
  workflow_dispatch:          # فقط اجرای دستی

permissions:
  contents: write             # برای کامیت کردن نتیجه (اختیاری)

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Run backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RANGE_DAYS: "700"
        run: python backtest.py

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: results/
          retention-days: 30

      - name: Commit latest.md (optional)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/latest.md || true
          git diff --cached --quiet || git commit -m "update backtest [skip ci]"
          git push || true
