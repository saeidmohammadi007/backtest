name: Crypto Pattern Scanner

on:
  workflow_dispatch:   # فقط اجرای دستی از تب Actions

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy dtw-python

      - name: Run pattern scanner
        run: python pattern_scanner.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pattern-scan-results
          path: pattern_scan_results.csv
          if-no-files-found: ignore
