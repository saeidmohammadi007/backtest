name: Candle Backtest

on:
  workflow_dispatch:        # اجرای دستی از تب Actions
  schedule:
    - cron: '0 6 * * 1'     # اختیاری: هر دوشنبه 06:00 UTC (اگر نمی‌خواهید، این دو خط را پاک کنید)

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install yfinance pandas numpy requests tqdm

      - name: Run backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backtest_yahoo.py

      - name: Save events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events
          path: events.csv
          if-no-files-found: ignore
