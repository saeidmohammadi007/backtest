name: BTC Similar Patterns Analysis

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install yfinance pandas numpy

      - name: Run analysis
        run: python btc_analysis.py

      - name: Upload CSV result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-similar-patterns
          path: btc_similar_patterns.csv
          if-no-files-found: warn
